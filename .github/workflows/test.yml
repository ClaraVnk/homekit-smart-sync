name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements_test.txt
      - name: Run unit tests with coverage
        run: |
          pytest tests/ --ignore=tests/integration \
            --cov=custom_components/homekit_smart_sync \
            --cov-branch \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-unit.xml
          flags: unit
          # Don't fail CI if Codecov upload glitches — coverage is observed,
          # not gated. The Codecov status check itself is the gate.
          fail_ci_if_error: false

  integration:
    name: Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements_integration.txt
      - name: Run integration tests with coverage
        run: |
          pytest tests/integration/ \
            --cov=custom_components/homekit_smart_sync \
            --cov-branch \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false
