<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#f6f8fa"/>

  <!-- Left column: Without Smart Sync -->
  <g transform="translate(40, 32)">
    <text font-size="20" font-weight="700" fill="#cf222e">✕  Without Smart Sync</text>
    <text y="22" font-size="12" fill="#6e7781">What Apple Home shows when HA pushes raw entity names</text>

    <g transform="translate(0, 50)">
      <rect width="360" height="60" rx="14" fill="white" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="34" cy="30" r="18" fill="#fde68a"/>
      <text x="34" y="35" font-size="16" text-anchor="middle">💡</text>
      <text x="68" y="28" font-size="14" font-weight="600" fill="#24292f">Living Room Ceiling Light</text>
      <text x="68" y="46" font-size="12" fill="#6e7781">Light · Living Room</text>
    </g>

    <g transform="translate(0, 122)">
      <rect width="360" height="60" rx="14" fill="white" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="34" cy="30" r="18" fill="#fde68a"/>
      <text x="34" y="35" font-size="16" text-anchor="middle">💡</text>
      <text x="68" y="28" font-size="14" font-weight="600" fill="#24292f">Living Room Floor Lamp</text>
      <text x="68" y="46" font-size="12" fill="#6e7781">Light · Living Room</text>
    </g>

    <g transform="translate(0, 194)">
      <rect width="360" height="60" rx="14" fill="white" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="34" cy="30" r="18" fill="#fde68a"/>
      <text x="34" y="35" font-size="16" text-anchor="middle">💡</text>
      <text x="68" y="28" font-size="14" font-weight="600" fill="#24292f">Bathroom Spotlight</text>
      <text x="68" y="46" font-size="12" fill="#6e7781">Light · Bathroom</text>
    </g>

    <g transform="translate(0, 280)">
      <rect width="360" height="108" rx="14" fill="#fff8c5" stroke="#d4a72c" stroke-width="1"/>
      <text x="18" y="28" font-size="13" font-style="italic" fill="#54450c">"Hey Siri, turn on the Living Room</text>
      <text x="18" y="44" font-size="13" font-style="italic" fill="#54450c">Ceiling Light"</text>
      <text x="18" y="72" font-size="12" fill="#80693c">→ "Living Room" is both the area name</text>
      <text x="18" y="88" font-size="12" fill="#80693c">  and part of the accessory. Siri asks.</text>
      <text x="18" y="104" font-size="13" font-weight="700" fill="#cf222e">✕  Ambiguous, slow, often fails</text>
    </g>
  </g>

  <!-- Right column: With Smart Sync -->
  <g transform="translate(500, 32)">
    <text font-size="20" font-weight="700" fill="#1a7f37">✓  With Smart Sync</text>
    <text y="22" font-size="12" fill="#6e7781">Area name stripped — HomeKit stores the clean alias</text>

    <g transform="translate(0, 50)">
      <rect width="360" height="60" rx="14" fill="white" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="34" cy="30" r="18" fill="#fde68a"/>
      <text x="34" y="35" font-size="16" text-anchor="middle">💡</text>
      <text x="68" y="28" font-size="14" font-weight="600" fill="#24292f">Ceiling Light</text>
      <text x="68" y="46" font-size="12" fill="#6e7781">Light · Living Room</text>
    </g>

    <g transform="translate(0, 122)">
      <rect width="360" height="60" rx="14" fill="white" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="34" cy="30" r="18" fill="#fde68a"/>
      <text x="34" y="35" font-size="16" text-anchor="middle">💡</text>
      <text x="68" y="28" font-size="14" font-weight="600" fill="#24292f">Floor Lamp</text>
      <text x="68" y="46" font-size="12" fill="#6e7781">Light · Living Room</text>
    </g>

    <g transform="translate(0, 194)">
      <rect width="360" height="60" rx="14" fill="white" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="34" cy="30" r="18" fill="#fde68a"/>
      <text x="34" y="35" font-size="16" text-anchor="middle">💡</text>
      <text x="68" y="28" font-size="14" font-weight="600" fill="#24292f">Spotlight</text>
      <text x="68" y="46" font-size="12" fill="#6e7781">Light · Bathroom</text>
    </g>

    <g transform="translate(0, 280)">
      <rect width="360" height="108" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
      <text x="18" y="28" font-size="13" font-style="italic" fill="#0a3622">"Hey Siri, turn on the ceiling light</text>
      <text x="18" y="44" font-size="13" font-style="italic" fill="#0a3622">in the living room"</text>
      <text x="18" y="72" font-size="12" fill="#2e6a40">→ Single match: light · Living Room.</text>
      <text x="18" y="88" font-size="12" fill="#2e6a40">  Executes immediately.</text>
      <text x="18" y="104" font-size="13" font-weight="700" fill="#1a7f37">✓  Instant, unambiguous, reliable</text>
    </g>
  </g>

  <!-- caption -->
  <text x="450" y="438" font-size="12" fill="#6e7781" text-anchor="middle">
    HA entity IDs and areas are never touched — only the per-entity alias the HomeKit bridge exposes.
  </text>
</svg>
